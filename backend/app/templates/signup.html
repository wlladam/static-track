{% extends "base.html" %}
{% block title %}Sign up - HOLDFAST{% endblock %}
{% block content %}
<p class="eyebrow">Get&nbsp;started</p>
<h1 class="display">SIGN&nbsp;UP</h1>
<p class="subtitle">Create your HOLDFAST account - track your training, and add friends.</p>

<div style="height: 1.5rem"></div>

<section class="panel auth-panel">
  <form action="{{ url_for('auth.signup') }}" method="post" class="auth-form">
    <label>Display name
      <input type="text" name="display_name" value="{{ display_name or '' }}" maxlength="60" required>
    </label>
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <p class="field-hint">At least 8 characters.</p>
    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
